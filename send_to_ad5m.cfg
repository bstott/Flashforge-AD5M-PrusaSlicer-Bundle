# Edit PRINTER_IP with your printer's IP address
# Find it: Printer touchscreen -> Settings -> Network -> IP Address
#
# Serial and Check Code are optional on firmware 2.1+
# If upload fails uncomment and add your credentials:
# Find them: Printer touchscreen -> Settings -> About
# ============================================================

[printer]
ip = 192.168.1.xxx

# Uncomment below if your firmware requires authentication:
# serial = XXXXXXXXXXXX
# check_code = xxxxxxxx
