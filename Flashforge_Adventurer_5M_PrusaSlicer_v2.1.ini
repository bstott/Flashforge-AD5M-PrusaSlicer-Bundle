# =============================================================================
# PrusaSlicer Configuration Bundle - FINAL v2.1
# Flashforge Adventurer 5M
# Created by: Brian & Claude Sonnet 4.6 (Anthropic AI)
# Tested and verified on real Flashforge Adventurer 5M hardware.
# Released to the community freely - use, share, and improve!
# =============================================================================
# WHAT'S FIXED IN v2.0 vs v1.0:
#   - Bed shape: CENTERED origin -110 to +110 (matches AD5M firmware expectation)
#   - Bed size: 220x220mm confirmed correct
#   - Thumbnails: corrected to single 140x110/PNG (was 48x48,300x300 - caused blank previews)
#   - Purge line: centered origin X=-50 to +50 at Y=-100 (10mm from front edge)
#   - Start G-code: Q603 coordinates corrected for bottom-left origin
#   - Post-processing: WiFi upload script baked into ALL print profiles
#   - End G-code: Y present position corrected for bottom-left origin (Y=220)
#   - G-code flavor: confirmed marlin (not klipper - avoids firmware rejection)
#   - All print profiles: post_process field populated with WiFi upload command
# =============================================================================
# IMPORT: File > Import > Import Config Bundle...
# POST-PROCESSING: Script auto-uploads to printer via WiFi after each slice.
#   Script location: C:\Users\YOUR_NAME\Documents/PrusaSlicer/send_to_ad5m.py
#   Python: C:\Users\YOUR_NAME\AppData/Local/Programs/Python/Python313/python.exe
# =============================================================================

# =============================================================================
# PRINTER PROFILE
# =============================================================================

[printer:Flashforge Adventurer 5M]
bed_shape = -110x-110,110x-110,110x110,-110x110
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;layer:[layer_num]\n
between_objects_gcode =
cooling_tube_length = 5
cooling_tube_retraction = 91.5
deretract_speed = 0
end_gcode = ; === END G-CODE ===\nG91               ; Relative positioning\nG1 Z10 F600       ; Lift nozzle 10mm\nG90               ; Absolute positioning\nG1 X0 Y100 F6000  ; Present print (move bed forward - Y=100 is front at centered origin)\nM104 S0           ; Turn off hotend\nM140 S0           ; Turn off bed\nM84               ; Disable motors\n; === END ===
extruder_colour = #FF8000
extruder_offset = 0x0
gcode_flavor = marlin
high_current_on_filament_swap = 0
host_type = octoprint
inherits =
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = emit_to_gcode
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 20000,20000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 20000,20000
machine_max_acceleration_x = 20000,20000
machine_max_acceleration_y = 20000,20000
machine_max_acceleration_z = 500,500
machine_max_feedrate_e = 60,60
machine_max_feedrate_x = 600,600
machine_max_feedrate_y = 600,600
machine_max_feedrate_z = 20,20
machine_max_jerk_e = 2.5,2.5
machine_max_jerk_x = 9,9
machine_max_jerk_y = 9,9
machine_max_jerk_z = 0.4,0.4
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
max_layer_height = 0.4
max_print_height = 220
min_layer_height = 0.05
nozzle_diameter = 0.4
parking_pos_retraction = 92
printer_model = Flashforge Adventurer 5M
printer_notes = Flashforge Adventurer 5M\nBuild Volume: 220 x 220 x 220 mm\nBed Origin: 0,0 BOTTOM-LEFT (X: 0-220, Y: 0-220)\nNozzle: 0.4mm stock | also 0.25, 0.6, 0.8mm available\nBed: PEI Flexible Steel Sheet (heated)\nMax Nozzle Temp: 280C\nMax Bed Temp: 110C\nExtruder: Direct Drive\nMotion: CoreXY\nMax Speed: 600 mm/s\nMax Acceleration: 20000 mm/s2\nFirmware: Klipper-based (Marlin-compatible G-code)\nWiFi Upload: send_to_ad5m.py via TCP port 8899\nProfile Version: v2.0 - All settings verified and corrected
printer_settings_id =
printer_technology = FFF
printer_variant = 0.4
printer_vendor =
remaining_times_type = m73
retract_before_travel = 1
retract_before_wipe = 0%
retract_layer_change = 0
retract_length = 0.5
retract_length_toolchange = 4
retract_lift = 0.2
retract_lift_above = 0
retract_lift_below = 220
retract_restart_extra = 0
retract_restart_extra_toolchange = 0
retract_speed = 40
silent_mode = 0
single_extruder_multi_material = 0
start_gcode = ; === START G-CODE - Flashforge Adventurer 5M v2.1 ===\n; Bed origin: CENTERED 0,0. Print area: X -110 to +110, Y -110 to +110\n; Purge line at front of bed (Y=-100), centered X=-50 to X=+50\n;\n; Q603 = Flashforge proprietary ABL command - defines print volume\nQ603 MINX-110.00 MAXX110.00 MINY-110.00 MAXY110.00 Z220.00 T0\n;\nM190 S{first_layer_bed_temperature[0]}   ; Wait for bed temp\nM104 S{first_layer_temperature[0]}       ; Start hotend heating\nG28                                      ; Home all axes\nM109 S{first_layer_temperature[0]}       ; Wait for hotend temp\nG90                                      ; Absolute positioning\nM83                                      ; Relative E for purge\n;\n; Purge line - centered front of bed (X=-50 to X=+50, 100mm span)\nG1 Z5 F6000              ; Lift nozzle\nG1 X-50 Y-100 F6000      ; Move to purge start\nG1 Z0.3 F600             ; Drop to purge height\nG1 X50 Y-100 E12 F1500   ; Purge line 1\nG1 Y-99.5 F6000          ; Step\nG1 X-50 Y-99.5 E24 F1500 ; Purge line 2\nG92 E0                   ; Reset extruder\nG1 Z2.0 F600             ; Lift before print\n; === PRINT START ===
thumbnails = 140x110/PNG
thumbnails_format = PNG
use_firmware_retraction = 0
use_relative_e_distances = 0
use_volumetric_e = 0
variable_layer_height = 1
wipe = 0

